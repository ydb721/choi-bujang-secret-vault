<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 보호된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d0a073; border-radius: 14px; color: #ffe9d4; background: #61472a44; }
    .auth-box { margin: 24px 0; padding: 20px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth-box h2 { font-size: 20px; margin: 0 0 16px; }
    .auth-form { display: grid; gap: 12px; }
    .auth-form label { display: grid; gap: 6px; color: #bfd0e5; font-size: 14px; }
    .auth-form input { width: 100%; padding: 12px; font: inherit; background: #101a28; color: #ecf4ff; border: 1px solid #51667c; border-radius: 8px; }
    .auth-box button { padding: 11px 16px; font: inherit; font-weight: 700; background: #8ad8df; color: #101a28; border: 0; border-radius: 8px; cursor: pointer; }
    .auth-box button:disabled { opacity: .6; cursor: wait; }
    .auth-status { margin: 10px 0 0; font-size: 14px; color: #bfd0e5; }
    .auth-error { margin: 10px 0 0; font-size: 14px; color: #ffadb9; min-height: 1.5em; }
    [hidden] { display: none !important; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 제작 2 — 서버 토큰 검증</div>
    <h1>보호된 자료실</h1>
    <p>Supabase Auth의 이메일·비밀번호로 로그인할 수 있습니다.</p>

    <section class="auth-box" aria-labelledby="auth-heading">
      <h2 id="auth-heading">계정 인증</h2>
      <form id="login-form" class="auth-form">
        <label>이메일
          <input id="email-input" type="email" autocomplete="username" required>
        </label>
        <label>비밀번호
          <input id="password-input" type="password" autocomplete="current-password" required>
        </label>
        <button id="login-btn" type="submit">로그인</button>
      </form>
      <div id="logged-in-view" hidden>
        <p class="auth-status">로그인 계정: <strong id="user-email-display"></strong></p>
        <button id="logout-btn" type="button">로그아웃</button>
      </div>
      <p id="auth-status" class="auth-status" aria-live="polite">로그인 상태 확인 중...</p>
      <p id="auth-error" class="auth-error" role="alert"></p>
    </section>

    <div class="notice">메모는 서버에서 토큰 검증에 성공했을 때만 제공합니다. 가상 메모의 추가·수정·삭제 기능은 제작 3에서 구현합니다.</div>
    <ul id="notes" aria-live="polite"><li>메모를 보려면 로그인하세요.</li></ul>
  </main>

  <script type="module">
    const supabaseUrl = 'https://pizhdpzwtognhuklasrt.supabase.co';
    const publishableKey = 'sb_publishable_E4o3qIRW_1RucMUHkOur2Q_gBN5SRqB';
    const form = document.querySelector('#login-form');
    const loginBtn = document.querySelector('#login-btn');
    const logoutBtn = document.querySelector('#logout-btn');
    const loggedInView = document.querySelector('#logged-in-view');
    const emailInput = document.querySelector('#email-input');
    const passwordInput = document.querySelector('#password-input');
    const userEmail = document.querySelector('#user-email-display');
    const status = document.querySelector('#auth-status');
    const errorText = document.querySelector('#auth-error');

    const notesList = document.querySelector('#notes');
    let notesGeneration = 0;

    const showNotesMessage = (message) => {
      const item = document.createElement('li');
      item.textContent = message;
      notesList.replaceChildren(item);
    };

    const loadMemos = async (session, generation) => {
      showNotesMessage('가상 자료를 불러오는 중입니다.');
      try {
        const response = await fetch('/api/memos', {
          cache: 'no-store',
          headers: { Authorization: `Bearer ${session.access_token}` },
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data?.error || `메모 요청 실패 (${response.status})`);
        }
        if (!Array.isArray(data)) {
          throw new Error('자료 응답 형식이 올바르지 않습니다.');
        }
        if (generation !== notesGeneration) return;

        if (data.length === 0) {
          showNotesMessage('등록된 가상 메모가 없습니다.');
          return;
        }

        notesList.replaceChildren(...data.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const body = document.createElement('span');
          title.textContent = note.title;
          body.textContent = note.content ?? '';
          item.append(title, body);
          return item;
        }));
      } catch (error) {
        if (generation === notesGeneration) {
          showNotesMessage(error.message ?? '메모 요청에 실패했습니다.');
        }
      }
    };

    const showError = (message) => { errorText.textContent = message; };
    const renderSession = (session) => {
      const signedIn = Boolean(session?.user && session?.access_token);
      const generation = ++notesGeneration;
      form.hidden = signedIn;
      loggedInView.hidden = !signedIn;
      userEmail.textContent = signedIn ? (session.user.email ?? '이메일 없음') : '';
      status.textContent = signedIn ? '로그인 상태' : '로그아웃 상태';

      if (signedIn) {
        passwordInput.value = '';
        void loadMemos(session, generation);
      } else {
        showNotesMessage('메모를 보려면 로그인하세요.');
      }
    };

    if (!window.supabase?.createClient) {
      form.hidden = true;
      status.textContent = '인증 초기화 실패';
      showError('Supabase 공식 SDK를 불러오지 못했습니다. 페이지를 새로고침해 주세요.');
    } else {
      const client = window.supabase.createClient(supabaseUrl, publishableKey);

      client.auth.onAuthStateChange((_event, session) => {
        renderSession(session);
      });

      try {
        const { data, error } = await client.auth.getSession();
        if (error) throw error;
        renderSession(data.session);
      } catch (error) {
        renderSession(null);
        showError(error.message ?? '로그인 상태를 확인하지 못했습니다.');
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        loginBtn.disabled = true;
        showError('');
        try {
          const { data, error } = await client.auth.signInWithPassword({
            email: emailInput.value.trim(),
            password: passwordInput.value,
          });
          if (error) throw error;
          renderSession(data.session);
        } catch (error) {
          showError(error.message ?? '로그인에 실패했습니다.');
        } finally {
          loginBtn.disabled = false;
        }
      });

      logoutBtn.addEventListener('click', async () => {
        logoutBtn.disabled = true;
        showError('');
        try {
          const { error } = await client.auth.signOut({ scope: 'local' });
          if (error) throw error;
          renderSession(null);
        } catch (error) {
          showError(error.message ?? '로그아웃에 실패했습니다.');
        } finally {
          logoutBtn.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
